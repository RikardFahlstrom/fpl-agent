[project]
name = "fpl-agent"
version = "0.1.0"
description = "FPL decision engine: capture, project, recommend, grade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
fpl-agent = "fpl_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]